name: "EARTHROPY: build Docker image"

# Every push to the "earthropy" branch builds a new image and publishes it to
# GitHub's container registry as ghcr.io/<your-user>/earthropy-dashboard:latest.
# The server (with Watchtower) picks it up automatically.
on:
  push:
    branches: [earthropy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: earthropy-docker
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/earthropy-dashboard" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          SKIP_ENV_VALIDATION: true
